name: Check site rendering

on:
  pull_request:
    branches: [master]

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: quarto-dev/quarto-actions/setup@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # Only what the site pages themselves need. Post code is never executed
      # in CI (freeze: true); results come from the committed _freeze/ folder.
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: any::rmarkdown, any::knitr, any::yaml, any::DT, any::htmltools

      - name: Render site
        run: quarto render

      - name: Fail if a post was executed (missing _freeze results)
        run: |
          if git status --porcelain _freeze/posts | grep -q .; then
            echo "::error::Some posts were executed during the build. Render your post locally and commit its _freeze/ folder."
            git status --porcelain _freeze/posts
            exit 1
          fi

      - name: Upload rendered site for preview
        uses: actions/upload-artifact@v7
        with:
          name: site-preview
          path: _site
          retention-days: 14
