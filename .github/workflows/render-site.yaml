name: Build and deploy site

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: quarto-dev/quarto-actions/setup@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: any::rmarkdown, any::knitr, any::yaml, any::DT, any::htmltools

      - name: Render site
        run: quarto render

      # TODO(deploy target): the domain is currently served by Netlify.
      # Requires repo secrets NETLIFY_AUTH_TOKEN and NETLIFY_SITE_ID.
      - name: Deploy to Netlify
        run: npx --yes netlify-cli@17 deploy --prod --dir=_site --site="$NETLIFY_SITE_ID"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
